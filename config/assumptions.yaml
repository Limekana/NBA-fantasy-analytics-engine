# =============================================================================
# EXPLICIT, EDITABLE PLAYER-LEVEL ASSUMPTIONS
# =============================================================================
# Handoff sec.7: "Keep injury assumptions explicit and editable."
# Nothing here is a fact. Every entry overrides the statistical baseline and is
# surfaced in the draft board's `assumption_notes` column so you can always see
# WHY a player moved.
#
# Add entries as news breaks in the days before the draft. Re-run:
#   python -m src.cli build-board
# =============================================================================

# Games a player is expected to miss, on top of the statistical baseline.
# Use for known surgeries, suspensions, and recovery timelines.
#   games_missed: hard subtraction from projected games
#   ramp_minutes_penalty: minutes/game reduction while ramping back
#   note: REQUIRED - the source and date of the information
injuries: {}
  # Example (delete or replace):
  # "Player Name":
  #   games_missed: 20
  #   ramp_minutes_penalty: 3.0
  #   availability_multiplier: 0.85
  #   note: "Achilles repair Feb 2026; reported Aug 2026 return target of December."

# Override projected minutes where role is changing for reasons the historical
# data cannot see (trade, new coach, rookie ahead of them on the depth chart).
role_minutes: {}
  # "Player Name":
  #   minutes: 32.0
  #   confidence: medium        # low | medium | high -> feeds role risk
  #   note: "Starting PG after the March 2026 trade."

# Role uncertainty multiplier, 0.0 (certain) to 1.0 (total unknown). Feeds the
# `risk` composite. Defaults to 0.25 for veterans, 0.55 for rookies (see
# src/projections/games_played.py) when not listed here.
role_uncertainty: {}
  # "Player Name": 0.7

# Players to exclude entirely (retired, overseas, two-way not expected to stick).
exclude: []

# =============================================================================
# ROOKIES - 2026 NBA draft class
# =============================================================================
# EVERY NUMBER BELOW IS AN ASSUMPTION. Rookies have no NBA game logs, so nothing
# here is measured - it is a prior built from college production, summer league,
# reported role, and draft position. Researched 2026-08-28.
#
# HOW THE PER-36 LINES WERE BUILT (so you can disagree with the method, not just
# the numbers):
#   1. Convert college per-game production to per-36.
#   2. Apply a rookie translation discount. Scoring efficiency drops hardest
#      (~60-70% retention for a top pick); rebounds and steals translate best
#      (~80-90%); assists sit in between and turnovers RISE.
#   3. Sanity-check against summer league where it exists - noting that summer
#      league inflates usage and deflates opponent quality, so it is a ceiling
#      indicator, not a projection.
#   4. Set minutes from the reported depth chart, not from talent.
#
# `confidence` drives BOTH game-to-game variance and role uncertainty:
#   high   = landing spot and role confirmed by multiple sources
#   medium = landing spot confirmed, role reported but not settled
#   low    = single source, or a source that may have been a MOCK draft.
#            VERIFY THESE YOURSELF before drafting them.
#
# In Lock-In, rookie volatility is not purely a cost - the week keeps their best
# game and discards the bust. Their risk is that the MINUTES never arrive, which
# is tracked separately as role_uncertainty. See src/projections/rookies.py.
# =============================================================================
rookies:

