name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0)"
        required: true

permissions:
  contents: write     # create the release
  packages: write     # push the container to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests must pass before anything is published
        run: pytest -q

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF#refs/tags/}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "repo_lc=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push the container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_lc }}:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.repo_lc }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A `docker save` of a multi-arch tag only captures the runner's platform,
      # so the tarball is explicitly labelled linux/amd64. Apple Silicon users
      # should `docker pull` instead - the registry resolves arm64 for them.
      # The tarball exists for the fully-offline case (no registry auth needed),
      # which matters because GHCR packages start out PRIVATE even on a public
      # repo until the owner flips them to public.
      - name: Export the image as a loadable tarball (linux/amd64)
        run: |
          docker pull --platform linux/amd64 ghcr.io/${{ steps.meta.outputs.repo_lc }}:${{ steps.meta.outputs.tag }}
          docker tag ghcr.io/${{ steps.meta.outputs.repo_lc }}:${{ steps.meta.outputs.tag }} nba-fantasy:${{ steps.meta.outputs.tag }}
          docker save nba-fantasy:${{ steps.meta.outputs.tag }} \
            | gzip > nba-fantasy-${{ steps.meta.outputs.tag }}-linux-amd64.tar.gz
          ls -lh nba-fantasy-*.tar.gz

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          files: nba-fantasy-*.tar.gz
          generate_release_notes: true
          body_file: .github/RELEASE_TEMPLATE.md
