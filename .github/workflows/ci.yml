name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Validate configuration
        run: python -m src.cli check-config

      - name: Scoring reference lines
        run: python -m src.cli scoring-check

      - name: End-to-end pipeline on synthetic data
        run: python -m src.cli demo --players 60

      - name: Backtest
        run: python -m src.cli backtest

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (tests run inside the build)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: nba-fantasy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          docker run --rm nba-fantasy:ci check-config
          docker run --rm nba-fantasy:ci scoring-check
          docker run --rm nba-fantasy:ci demo --players 40
