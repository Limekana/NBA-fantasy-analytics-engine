# Convenience wrapper so draft-day commands are short.
#
#   docker compose run --rm engine demo
#   docker compose run --rm engine build-board
#   docker compose run --rm engine draft --pick 17 --slot 4
#
# config/, data/ and outputs/ are bind-mounted, so editing config/league.yaml or
# config/assumptions.yaml on the host takes effect on the next run with no
# rebuild - which matters when news breaks during the draft.

services:
  engine:
    build: .
    image: nba-fantasy-analytics-engine:latest
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./outputs:/app/outputs
    # No `user:` override on purpose. The image already runs as uid 1000
    # (USER analyst in the Dockerfile), which keeps bind-mounted output owned by
    # a normal user rather than root. Setting `user: "${UID}:${GID}"` here looks
    # tidier but breaks on Windows and macOS, where those variables do not exist
    # and Compose substitutes empty strings.
